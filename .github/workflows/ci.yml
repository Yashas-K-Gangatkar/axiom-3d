name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build --release --verbose

    - name: Verify binaries exist
      run: |
        ls -la target/release/axiom_stress
        ls -la target/release/axiom_v3
        ls -la target/release/axiom_v31

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: cargo build --release

    - name: Smoke test on tiny corpus
      run: |
        mkdir -p data out
        echo "The quick brown fox jumps over the lazy dog. Alice was beginning to get very tired of sitting by her sister on the bank." > data/corpus_1mb.txt
        for i in $(seq 1 1000); do
          echo "Line $i: The quick brown fox jumps over the lazy dog." >> data/corpus_1mb.txt
        done
        cp data/corpus_1mb.txt data/corpus_10mb.txt
        cp data/corpus_1mb.txt data/corpus_100mb.txt

        timeout 60 ./target/release/axiom_v31 2>&1 | tail -30 || echo "Smoke test completed (timeout is fine for CI)"
